[versions]
# libraries
minecraft = "1.21.4-R0.1-SNAPSHOT"
adventure = "4.21.0"
adventurePlatformBukkit = "4.4.0"
assertj = "3.23.1"
mockito = "4.11.0"
jupiter = "5.9.1"
placeholderapi = "2.11.6"
cloudPaper = "2.0.0-beta.10"
cloud = "2.0.0"

# plugins
shadow = "9.0.0-beta2"
userdev = "2.0.0-beta.17"
pluginYml = "0.7.1"

[libraries]
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "minecraft" }
adventureApi = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventurePlatformBukkit = { group = "net.kyori", name = "adventure-platform-bukkit", version.ref = "adventurePlatformBukkit" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
mockitoCore = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
jupiterApi = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "jupiter" }
jupiterParams = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "jupiter" }
jupiterEngine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "jupiter" }
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
cloudPaper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloudPaper" }
cloudAnnotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
userdev = { id = "io.papermc.paperweight.userdev", version.ref = "userdev" }
pluginYml = { id = "de.eldoria.plugin-yml.paper", version.ref = "pluginYml" }
